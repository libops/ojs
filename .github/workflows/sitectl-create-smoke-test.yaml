name: sitectl-create-smoke-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitectl-create-smoke-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create:
    name: sitectl create ojs ${{ matrix.create_definition }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - create_definition: default
            create_args: >-
              --yolo
    uses: libops/.github/.github/workflows/sitectl-create-smoke-test.yaml@782ba8f6514788269e93e0a51c001061279f645a # main
    with:
      plugin: ojs
      create-definition: ${{ matrix.create_definition }}
      create-args: ${{ matrix.create_args }}
      packages: sitectl sitectl-ojs
      package-versions: sitectl=1.8.2 sitectl-ojs=1.3.0
      allow-unversioned-packages: false
      run-verify: true
      verify-args: --disposable
